[project]
name = "sylliba-cli"
version = "0.1.0"
description = "CLI tool for translating i18n files to multiple languages"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hydra Dynamix", email = "hello@hydradynamix.com" }]
keywords = ["i18n", "translation", "localization", "cli", "internationalization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
sylliba = "sylliba_cli.main:app"

[project.urls]
Homepage = "https://github.com/hydra-dynamix/sylliba-cli"
Documentation = "https://github.com/hydra-dynamix/sylliba-cli#readme"
Repository = "https://github.com/hydra-dynamix/sylliba-cli"
Issues = "https://github.com/hydra-dynamix/sylliba-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sylliba_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
